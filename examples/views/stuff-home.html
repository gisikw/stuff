<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stuff</title>
<style>
:root{color-scheme:light;--ink:#25231f;--muted:#716d64;--line:#dedbd3;--paper:#faf9f6;--card:#fff;--accent:#385d54;--open:#fff6df;--done:#eaf4ef;--active:#edf2fa;--deferred:#f1efeb}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}main{width:min(1120px,calc(100% - 2rem));margin:2rem auto 5rem}header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.6rem}h1{font-size:2rem;line-height:1.1;margin:0}h2{font-size:1.15rem;margin:.2rem 0 1rem}.eyebrow,.muted,.stamp{color:var(--muted);font-size:.86rem}.links{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.45rem}.links a,.all{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--accent);padding:.35rem .7rem;text-decoration:none}.section{margin-top:2rem}.activity{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.activity a,.work a{display:block;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit;padding:.75rem .85rem;text-decoration:none}.activity a:hover,.work a:hover{border-color:var(--accent)}.name{font-weight:650;line-height:1.3;margin-bottom:.2rem}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}.lane{border-radius:11px;padding:.8rem;background:var(--deferred);min-width:0}.lane[data-state="open"]{background:var(--open)}.lane[data-state="in_progress"]{background:var(--active)}.lane[data-state="done"]{background:var(--done)}.lane-head{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.7rem;font-weight:700}.work{display:grid;gap:.55rem}.short{font:12px/1.35 ui-monospace,monospace;color:var(--muted)}.empty{color:var(--muted);font-style:italic}.warning{border-left:4px solid #b58134;background:#fff7e9;padding:.65rem .8rem;margin:1rem 0}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem}.hidden{display:none}@media(max-width:820px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{width:min(100% - 1rem,1120px);margin-top:1rem}header{display:block}.links{justify-content:flex-start;margin-top:.8rem}.activity,.board{grid-template-columns:1fr}.activity a{padding:.85rem}.lane{padding:.75rem}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">Durable Items and Notes</div><h1 id="title">Stuff</h1><div id="subtitle" class="muted">A userland projection</div></div><nav id="links" class="links"><a href="/read">Reverse cron</a></nav></header>
<div id="warning" class="warning hidden"></div>
<section class="section"><div class="section-head"><h2>Recently active</h2><a class="all" href="/read">All activity</a></div><div id="activity" class="activity"><div class="empty">Loading…</div></div></section>
<section class="section"><div class="section-head"><h2>Work convention</h2><span class="muted">metadata.status · advisory</span></div><div id="board" class="board"></div></section>
</main>
<script>
(() => {
  const state = {snapshot: null, items: null, notes: null, errors: []};
  const lanes = [
    ["in_progress", "In progress"], ["open", "Open"], ["done", "Done"], ["other", "Other / deferred"]
  ];
  const escapeHTML = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const shortID = (id) => { const i = id.indexOf("_"); return i >= 0 && id.length - i - 1 > 8 ? id.slice(0, i + 9) : id; };
  const time = (raw) => {
    const at = Date.parse(raw); if (!Number.isFinite(at)) return raw || "unknown";
    const seconds = (at - Date.now()) / 1000;
    let divisor = 1, unit = "second";
    if (Math.abs(seconds) >= 86400) { divisor = 86400; unit = "day"; }
    else if (Math.abs(seconds) >= 3600) { divisor = 3600; unit = "hour"; }
    else if (Math.abs(seconds) >= 60) { divisor = 60; unit = "minute"; }
    return new Intl.RelativeTimeFormat(undefined, {numeric:"auto"}).format(Math.round(seconds / divisor), unit);
  };
  const itemPath = (id) => `/read/items/${encodeURIComponent(id)}`;
  const itemCard = (item, activityAt, noteCount) => `<a href="${itemPath(item.id)}"><div class="name">${escapeHTML(item.name)}</div><div class="stamp" title="${escapeHTML(activityAt)}">${escapeHTML(time(activityAt))} · ${noteCount} ${noteCount === 1 ? "Note" : "Notes"}</div><div class="short" title="${escapeHTML(item.id)}">${escapeHTML(shortID(item.id))}</div></a>`;
  const configure = () => {
    const metadata = state.snapshot?.item?.metadata;
    if (!metadata || typeof metadata !== "object" || Array.isArray(metadata)) return;
    if (typeof metadata.title === "string") document.getElementById("title").textContent = metadata.title;
    if (typeof metadata.subtitle === "string") document.getElementById("subtitle").textContent = metadata.subtitle;
    if (Array.isArray(metadata.bookmarks)) {
      const nav = document.getElementById("links");
      for (const bookmark of metadata.bookmarks) {
        if (!bookmark || typeof bookmark.label !== "string" || typeof bookmark.href !== "string" || !bookmark.href.startsWith("/")) continue;
        const link = document.createElement("a"); link.textContent = bookmark.label; link.href = bookmark.href; nav.append(link);
      }
    }
  };
  const render = () => {
    if (!state.items || !state.notes) return;
    const notesByItem = new Map();
    for (const note of state.notes) {
      const list = notesByItem.get(note.item_id) || []; list.push(note); notesByItem.set(note.item_id, list);
    }
    const activity = state.items.filter((item) => item.id !== state.snapshot?.item?.id).map((item) => {
      const notes = notesByItem.get(item.id) || [];
      let at = item.updated_at || item.created_at;
      for (const note of notes) {
        const candidate = note.updated_at || note.created_at;
        if (Date.parse(candidate) > Date.parse(at)) at = candidate;
      }
      return {item, notes, at};
    }).sort((a,b) => Date.parse(b.at) - Date.parse(a.at) || a.item.id.localeCompare(b.item.id));
    document.getElementById("activity").innerHTML = activity.slice(0, 12).map(({item,notes,at}) => itemCard(item, at, notes.length)).join("") || '<div class="empty">No Items yet.</div>';
    const grouped = new Map(lanes.map(([key]) => [key, []]));
    for (const entry of activity) {
      const metadata = entry.item.metadata;
      const value = metadata && typeof metadata === "object" && !Array.isArray(metadata) ? metadata.status : undefined;
      const lane = value === "open" || value === "in_progress" || value === "done" ? value : "other";
      grouped.get(lane).push(entry);
    }
    document.getElementById("board").innerHTML = lanes.map(([key,label]) => {
      const entries = grouped.get(key);
      const cards = entries.slice(0, 10).map(({item,notes,at}) => itemCard(item, at, notes.length)).join("") || '<div class="empty">Nothing here.</div>';
      return `<section class="lane" data-state="${key}"><div class="lane-head"><span>${label}</span><span>${entries.length}</span></div><div class="work">${cards}</div></section>`;
    }).join("");
    if (state.items.length >= 200 || state.notes.length >= 200 || state.errors.length) {
      const warning = document.getElementById("warning"); warning.classList.remove("hidden");
      warning.textContent = state.errors.length ? state.errors.join(" · ") : "This projection reached Stuff's 200-document bound; some activity may be omitted.";
    }
  };
  addEventListener("message", (event) => {
    const message = event.data;
    if (!message || typeof message !== "object") return;
    if (message.type === "stuff:view-snapshot") { state.snapshot = message; configure(); render(); return; }
    if (message.type !== "stuff:view-query-result") return;
    if (!message.ok) state.errors.push(`${message.request_id} unavailable`);
    const docs = message.result?.docs;
    if (message.request_id === "home-items") state.items = Array.isArray(docs) ? docs : [];
    if (message.request_id === "home-notes") state.notes = Array.isArray(docs) ? docs : [];
    render();
  });
  parent.postMessage({type:"stuff:view-query",request_id:"home-items",resource:"items",query:{selector:{},limit:200}}, "*");
  parent.postMessage({type:"stuff:view-query",request_id:"home-notes",resource:"notes",query:{selector:{},limit:200}}, "*");
})();
</script>
</body>
</html>
