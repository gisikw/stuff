<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stuff Kanban</title>
<style>
:root{color-scheme:light;--ink:#1f2926;--muted:#69736f;--line:#d9dfdc;--paper:#f6f8f7;--card:#fff;--accent:#236b56;--warn:#8a5a16}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 system-ui,-apple-system,sans-serif}main{width:min(1200px,calc(100% - 2rem));margin:1.5rem auto 4rem}header{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1rem}h1{margin:0;font-size:1.7rem}.muted{color:var(--muted)}#notice{min-height:2.3rem;padding:.45rem .65rem;margin:.6rem 0;border-left:3px solid transparent}#notice[data-kind="error"]{background:#fff4e5;border-color:var(--warn)}#notice[data-kind="ok"]{background:#e9f6ef;border-color:var(--accent)}.board{display:grid;grid-template-columns:repeat(var(--lanes,3),minmax(210px,1fr));gap:.75rem;align-items:start;overflow:auto;padding-bottom:.5rem}.lane{min-height:12rem;border:1px solid var(--line);border-radius:10px;background:#edf1ef;padding:.65rem}.lane.over{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}.lane h2{display:flex;justify-content:space-between;margin:0 0 .6rem;font-size:1rem}.cards{display:grid;gap:.55rem;min-height:8rem}.card{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:.7rem;box-shadow:0 1px 2px #0000000a;cursor:grab}.card:active{cursor:grabbing}.card.pending{opacity:.58}.card h3{margin:0 0 .35rem;font-size:.98rem}.card a{color:var(--accent)}.card code{display:block;color:var(--muted);font-size:.75rem}.empty{color:var(--muted);font-style:italic;padding:.5rem}.back{color:var(--accent)}@media(max-width:700px){main{width:calc(100% - 1rem);margin-top:.75rem}.board{grid-template-columns:repeat(var(--lanes,3),minmax(78vw,1fr))}header{align-items:start;flex-direction:column}}
</style>
</head>
<body>
<main>
<header><div><div class="muted">Explicitly linked Items</div><h1 id="title">Kanban</h1></div><a class="back" href="/read" target="_top">All Items</a></header>
<div id="notice" role="status" aria-live="polite"></div>
<div id="board" class="board"><div class="muted">Loading board…</div></div>
</main>
<script>
(() => {
  const state = {snapshot:null, items:new Map(), pending:new Map(), sequence:0};
  const board = document.getElementById("board");
  const notice = document.getElementById("notice");
  const config = () => state.snapshot?.item?.metadata?.stuff_kanban;
  const linked = () => Array.isArray(config()?.cards) ? config().cards.filter(x => typeof x === "string") : [];
  const lanes = () => Array.isArray(config()?.lanes) ? config().lanes.filter(x => typeof x === "string") : [];
  const say = (text, kind="") => { notice.textContent=text; notice.dataset.kind=kind; };
  const short = id => id.length > 18 ? id.slice(0,15)+"…" : id;
  const render = () => {
    const laneNames=lanes(), cardIDs=linked();
    if (!state.snapshot || !laneNames.length) return;
    document.getElementById("title").textContent = typeof config().title === "string" ? config().title : state.snapshot.item.name;
    board.style.setProperty("--lanes", Math.min(laneNames.length,5));
    board.replaceChildren(...laneNames.map(lane => {
      const section=document.createElement("section"); section.className="lane"; section.dataset.lane=lane;
      const cards=cardIDs.map(id=>state.items.get(id)).filter(item=>item && item.metadata?.status===lane);
      const heading=document.createElement("h2"); heading.append(document.createTextNode(lane),Object.assign(document.createElement("span"),{textContent:String(cards.length),className:"muted"}));
      const list=document.createElement("div"); list.className="cards";
      for (const item of cards) {
        const card=document.createElement("article"); card.className="card"+(state.pending.has(item.id)?" pending":""); card.draggable=!state.pending.has(item.id); card.dataset.id=item.id;
        const name=document.createElement("h3"), link=document.createElement("a"); link.textContent=item.name; link.href=`/read/items/${encodeURIComponent(item.id)}?plain=1`; link.target="_top"; name.append(link);
        const id=document.createElement("code"); id.textContent=short(item.id); id.title=item.id; card.append(name,id); list.append(card);
      }
      if (!cards.length) list.append(Object.assign(document.createElement("div"),{className:"empty",textContent:"Drop a card here"}));
      section.append(heading,list); return section;
    }));
  };
  const move = (id, status) => {
    const item=state.items.get(id);
    if (!item || state.pending.has(id) || !lanes().includes(status) || item.metadata?.status===status) return;
    const previous=item.metadata.status, request=`move-${++state.sequence}`;
    state.pending.set(id,{request,previous}); item.metadata={...item.metadata,status}; render(); say(`Moving ${item.name}…`);
    parent.postMessage({type:"stuff:view-status-update",request_id:request,item_id:id,status,revision:item.revision},"*");
  };
  board.addEventListener("dragstart", event => { const card=event.target.closest(".card"); if (!card) return; event.dataTransfer.setData("text/plain",card.dataset.id); event.dataTransfer.effectAllowed="move"; });
  board.addEventListener("dragover", event => { const lane=event.target.closest(".lane"); if (!lane) return; event.preventDefault(); lane.classList.add("over"); });
  board.addEventListener("dragleave", event => event.target.closest(".lane")?.classList.remove("over"));
  board.addEventListener("drop", event => { const lane=event.target.closest(".lane"); if (!lane) return; event.preventDefault(); lane.classList.remove("over"); move(event.dataTransfer.getData("text/plain"),lane.dataset.lane); });
  addEventListener("message", event => {
    if (event.source !== parent || !event.data || typeof event.data !== "object") return;
    const message=event.data;
    if (message.type==="stuff:view-snapshot") { state.snapshot=message; render(); return; }
    if (message.type==="stuff:view-query-result" && message.request_id==="kanban-cards") {
      for (const item of Array.isArray(message.result?.docs)?message.result.docs:[]) state.items.set(item.id,item);
      if (!message.ok) say("Cards could not be loaded.","error"); render(); return;
    }
    if (message.type!=="stuff:view-status-result") return;
    const entry=[...state.pending.entries()].find(([,pending])=>pending.request===message.request_id); if (!entry) return;
    const [id,pending]=entry; state.pending.delete(id);
    if (message.ok && message.result?.item) { state.items.set(id,message.result.item); say("Card moved.","ok"); }
    else if (message.status===409 && message.result?.current) { state.items.set(id,message.result.current); say("This card changed elsewhere. It was refreshed; drag it again to retry.","error"); }
    else { const item=state.items.get(id); if (item) item.metadata={...item.metadata,status:pending.previous}; say(message.result?.error?.reason||message.error||"Card could not be moved.","error"); }
    render();
  });
  parent.postMessage({type:"stuff:view-query",request_id:"kanban-cards",resource:"items",query:{selector:{},limit:200}},"*");
})();
</script>
</body>
</html>
